name: Market read

# NEM times 07:15 / 12:35 / 15:30 -> UTC 21:15 (previous day) / 02:35 / 05:30
# (fixed UTC+10, no daylight saving - see NEM_TZ in nemweb_common.py).
on:
  schedule:
    - cron: "15 21 * * *"
    - cron: "35 2 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: market-read
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPICS_JSON: ${{ secrets.NTFY_TOPICS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/market_read.py

      - name: Commit and push state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
