name: Recap

# NEM Mon-Fri 07:00 -> UTC Sun-Thu 21:00 (previous day) - fixed UTC+10, no daylight
# saving (see NEM_TZ in nemweb_common.py). Cron day-of-week 0-4 = Sun-Thu in UTC,
# which lands on Mon-Fri once shifted forward to NEM time. Weekdays-only means
# Monday's run naturally spans since Friday (the weekend recap case) with no
# separate scheduling needed for it - see notification_recap.py.
on:
  schedule:
    - cron: "0 21 * * 0-4"
  workflow_dispatch: {}

concurrency:
  group: recap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPICS_JSON: ${{ secrets.NTFY_TOPICS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/notification_recap.py

      - name: Commit and push state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
