name: Daily morning batch

# 19:00 UTC = 05:00 NEM time (Australia/Brisbane, fixed UTC+10, no daylight saving -
# see NEM_TZ in nemweb_common.py). These 7 scripts previously ran at their own
# slightly different times a few minutes apart (05:02-06:10 NEM) on Windows Task
# Scheduler; grouped into one run here so there's only one state commit instead of
# seven near-simultaneous ones racing to push.
# 2026-09-09: repository_dispatch is now the primary trigger (external pinger via
# cron-job.org) - see spot-spike.yml for the measured evidence on why (this workflow's own
# schedule: runs were also landing hours late, e.g. 10:26am/3:05pm instead of 7am). `schedule:`
# kept as a fallback only.
on:
  schedule:
    - cron: "0 19 * * *"
  repository_dispatch:
    types: [tick-daily]
  workflow_dispatch: {}

concurrency:
  group: daily-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPICS_JSON: ${{ secrets.NTFY_TOPICS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/rebid_reconciler.py
      - run: python scripts/cap_quarter_to_date.py
      - run: python scripts/gas_spread_tracker.py
      - run: python scripts/closure_watcher.py
      - run: python scripts/negative_pricing_tracker.py
      - run: python scripts/coal_fleet_trend.py
      - run: python scripts/reserve_outlook.py
      - run: python scripts/weather_outlook.py

      - name: Commit and push state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
