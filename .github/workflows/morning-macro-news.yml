name: Morning macro news

# Primary trigger is repository_dispatch (external cron-job.org pinger set to 6:30am Sydney
# time, same pattern as this repo's other workflows - see spot-spike.yml for why `schedule:`
# alone is unreliable on GitHub's own scheduler). `schedule:` below is a low-frequency fallback
# only, fixed at 20:30 UTC (6:30am AEST) - it will drift an hour during AEDT since GitHub cron
# doesn't follow daylight saving; the cron-job.org ping is what keeps the real time correct.
on:
  schedule:
    - cron: "30 20 * * *"
  repository_dispatch:
    types: [morning-macro-news]
  workflow_dispatch: {}

concurrency:
  group: morning-macro-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NTFY_TOPIC_MACRO_NEWS: ${{ secrets.NTFY_TOPIC_MACRO_NEWS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python scripts/morning_macro_news.py

      - name: Commit and push state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/morning_macro_news_state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update morning macro news state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
