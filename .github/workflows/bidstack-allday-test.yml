name: bid stack all-day test (branch only)
on:
  push:
    branches: [bidstack-allday]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run all-day analysis for yesterday (no push, no commit)
        run: |
          set -o pipefail
          python scripts/bid_stack_analysis.py --force --allow-partial 2>&1 | tee run.log
          echo "::notice title=summary::$(tail -40 run.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        with:
          name: bidstack-page
          path: |
            docs/bidstack/index.html
            state/bidstack_region_history.csv
            run.log
