name: Every 30 minutes

# 2026-09-09: repository_dispatch is now the primary trigger (external pinger via
# cron-job.org) - see spot-spike.yml for the measured evidence on why. `schedule:` kept as
# a low-frequency fallback only.
on:
  schedule:
    - cron: "0 * * * *"
  repository_dispatch:
    types: [tick-30min]
  workflow_dispatch: {}

concurrency:
  group: every-30-min
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPICS_JSON: ${{ secrets.NTFY_TOPICS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/cap_dayahead.py
      - run: python scripts/predispatch_tracker.py

      # Hourly STPASA unit-availability changes (>= 100MW), the near-term counterpart of
      # pasa_monitor.py (MTPASA, every 3 hours). Own state guard, so most ticks are a no-op.
      # continue-on-error: an alert-side failure must not block the state commit below.
      - run: python scripts/stpasa_monitor.py
        continue-on-error: true

      - name: Commit and push state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
