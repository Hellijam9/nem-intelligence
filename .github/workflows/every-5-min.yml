name: Every 5 minutes

# 2026-09-09: repository_dispatch is now the primary trigger (external pinger via
# cron-job.org) - see spot-spike.yml for the measured evidence on why. Same event type as
# spot-spike.yml ("tick-5min") since one external ping fires every workflow listening for
# it. `schedule:` kept as a low-frequency fallback only.
on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [tick-5min]
  workflow_dispatch: {}

concurrency:
  group: every-5-min
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPICS_JSON: ${{ secrets.NTFY_TOPICS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/customer_watcher.py
      - run: python scripts/interconnector_monitor.py
      - run: python scripts/scada_drop_monitor.py

      - name: Commit and push state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
