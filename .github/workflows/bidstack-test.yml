name: bid stack test (branch only)
on:
  push:
    branches: [bid-stack]
    paths: ["scripts/bid_stack*", "scratch/shot.py", ".github/workflows/bidstack-test.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p scratch
          ( rm -f state/bidstack_history.csv; python scripts/bid_stack_analysis.py 20 --backfill && /usr/bin/time -v python scripts/bid_stack_analysis.py --force --no-push ) > scratch/test_log.txt 2>&1 || echo "EXIT $?" >> scratch/test_log.txt
      - run: |
          pip install playwright && python -m playwright install --with-deps chromium
          python scratch/shot.py >> scratch/test_log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scratch/test_log.txt scratch/*.png docs/bidstack state/bidstack_history.csv state/bidstack_state.json 2>/dev/null || true
          git commit -m "bid stack test output [skip ci]" && git push
