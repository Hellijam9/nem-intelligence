name: bid stack test (branch only)
on:
  push:
    branches: [bid-stack]
    paths: ["scratch/*.py", ".github/workflows/bidstack-test.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python scratch/probe.py > scratch/out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scratch/out.txt && git commit -m "probe output [skip ci]" && git push
