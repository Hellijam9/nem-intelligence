name: bid stack adhoc run
on:
  push:
    branches: [bidstack-run]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python scratch/overnight.py > scratch/out.txt 2>&1 || echo "EXIT $?" >> scratch/out.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scratch/out.txt && git commit -m "adhoc output [skip ci]" && git push
