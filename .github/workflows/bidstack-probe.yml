name: bidstack probe
on:
  push:
    branches: [bidstack-probe]
    paths: ["scratch/*.py", ".github/workflows/bidstack-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python scratch/probe.py > scratch/probe_out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/probe_out.txt && git commit -m "probe output [skip ci]" && git push
