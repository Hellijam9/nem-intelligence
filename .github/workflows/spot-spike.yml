name: Spot spike

# Split out from every-5-min.yml into its own single-script workflow (2026-09-03) - the
# bundled 4-script job was averaging 201 minutes between runs instead of 5 (measured live:
# 57 runs over 8 days instead of the ~2300 a true 5-min cadence would produce, worst gap
# 11 hours). A smaller/faster job is less likely to still be running when the next
# scheduled trigger fires, which is one real, fixable contributing factor - though the
# evidence (gaps as low as 22 min even when it did fire) points mostly to GitHub Actions'
# own scheduler deprioritizing high-frequency crons, which this alone may not fully fix.
# 2026-09-09: added repository_dispatch as the primary trigger - confirmed live that
# GitHub's own `schedule:` events get queued/delayed (this workflow averaged 180min between
# runs instead of 5, worst gap 5.4h) while dispatch-triggered runs start with zero measured
# delay (created_at == run_started_at on every manual trigger tested). An external scheduler
# (cron-job.org) now pings GitHub's repository_dispatch API on the real 5-min cadence instead.
# `schedule:` is kept as a low-frequency fallback in case the external pinger itself goes down.
on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [tick-5min]
  workflow_dispatch: {}

concurrency:
  group: spot-spike
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPICS_JSON: ${{ secrets.NTFY_TOPICS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/spot_spike.py

      - name: Commit and push state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
